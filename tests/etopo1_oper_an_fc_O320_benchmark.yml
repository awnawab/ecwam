grid:        O320
directions:  24
frequencies: 29
bathymetry:  ETOPO1

advection:
    timestep: 900
    fast_waves:
        timestep: 450
        max_frequency: 4
physics:
    timestep: 900

forecast.begin: 2023-01-01 00:00:00
forecast.end:   2023-01-01 06:00:00

begin: ${forecast.begin}
end:   ${forecast.end}

nproma: 64
lwamanout: F
lgribout: T
irefra: 2
llgcbz0: T
llnormagam: T
lciwa3: T
lciscal: T

forcings:
    file:  data/forcings/oper_an_12h_fc_2023010100_36h_O320.grib

    at:
      - begin:     ${forecast.begin}
        end:       ${forecast.end}
        timestep:  01:00

output:
    fields:
        name:
          - swh         # Significant height of combined wind waves and swell
        format: grib    # (default : grib) or binary
        at:
          - timestep: 01:00

    restart:
        format: binary # (default : binary) or grib
        at:
          - time: ${end}


